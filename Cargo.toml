[package]
name = "nix-deploy"
version = "0.1.0"
edition = "2024"

[dependencies]
rustix = { version = "1.1.4", features = ["termios", "process"] }
rustix-openpty = "0.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"
clap = { version = "4.6.6", features = ["derive"] }
eyre = "0.6.14"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
flume = { version = "0.12.0", default-features = false }
winnow = { version = "1.0.4", default-features = false, features = ["std", "parser"] }
circular = "0.3.0"
polling = "3.11.0"
camino = { version = "1.2.5", features = ["serde1"] }
tap = "1.0.1"
once_cell = "1.21.4"
serde_with = { version = "3.22.0", features = ["hex"] }
bech32 = "0.12.0"
curve25519-dalek = "5.0.0"
toml = { version = "1.1.5", default-features = false, features = ["std", "serde", "parse"] }
regex = "1.13.1"
saphyr = { version = "0.0.12", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
bstr = { version = "1.13.1", default-features = false, features = ["std"] }
derive_more = { version = "2.1.1", features = ["display", "error", "debug", "from"] }
by_address = "1.2.1"

tokio = { version = "1.53.1", features = ["rt"] }
futures = "0.3.34"
russh = { version = "0.63.2", default-features = false, features = ["ring"] }

[lints.rust]
irrefutable_let_patterns = "allow"

[lints.clippy]
needless_lifetimes = "allow"
disallowed_methods = "deny"
too_many_arguments = "allow"
